---
- name: Install FreePBX 17 on Debian 12
  hosts: localhost
  connection: local
  become: true
  environment:
    LC_ALL: C
    DEBIAN_FRONTEND: noninteractive

  vars_files:
    - defaults.yml

  pre_tasks:
    - name: Check supported platform
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '12'
          - ansible_architecture == 'x86_64'
          - ansible_service_mgr == 'systemd'
          - ansible_virtualization_type not in ['docker', 'lxc', 'podman', 'container']
        fail_msg: Use a fresh Debian 12 amd64 machine or full VM with systemd, not a container.

    - name: Check hostname resolution required by the upstream installer
      ansible.builtin.command: hostname -f
      changed_when: false

    - name: Validate NTP client networks
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import ipaddress, sys; ipaddress.ip_network(sys.argv[1], strict=True)
          - "{{ item }}"
      loop: "{{ ntp_allowed_networks }}"
      changed_when: false

  tasks:
    # Leave existing SSH authentication untouched; never enable root passwords.
    - name: Create private installation state directory
      ansible.builtin.file:
        path: /var/lib/freepbx-install
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install and validate FreePBX
      ansible.builtin.import_tasks: tasks/install.yml

    - name: Configure optional serial console
      ansible.builtin.import_tasks: tasks/serial.yml
      when: enable_serial_console | bool

    - name: Remove legacy unrestricted NTP allow directive
      ansible.builtin.lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^\s*allow\s*(#.*)?$'
        state: absent
      notify: restart chrony

    - name: Restrict NTP serving to explicit client networks
      ansible.builtin.blockinfile:
        path: /etc/chrony/chrony.conf
        insertafter: EOF
        marker: '# {mark} ANSIBLE MANAGED NTP CLIENT ACCESS'
        block: |
          port {{ 123 if ntp_allowed_networks | length > 0 else 0 }}
          deny all
          {% for network in ntp_allowed_networks %}
          allow {{ network }}
          {% endfor %}
      notify: restart chrony

    - name: Add custom PSTN dialplan (from-pstn-sg)
      ansible.builtin.blockinfile:
        path: /etc/asterisk/extensions_custom.conf
        create: true
        owner: asterisk
        group: asterisk
        mode: '0644'
        marker: '; {mark} ANSIBLE MANAGED BLOCK - from-pstn-sg'
        block: "{{ lookup('ansible.builtin.file', 'files/from-pstn-sg.conf') }}"

    - name: Inspect installed modules
      ansible.builtin.import_tasks: tasks/modules.yml

    - name: Install certman when not already enabled
      ansible.builtin.command: fwconsole ma downloadinstall certman --autoenable --no-interaction
      when: (freepbx_module_rows | selectattr('0', 'equalto', 'certman') | list | first | default(['', '', '']))[2] != 'Enabled'

    - name: Fix FreePBX permissions
      ansible.builtin.command: fwconsole chown
      changed_when: false

    - name: Reload FreePBX and fail on configuration errors
      ansible.builtin.command: fwconsole reload
      changed_when: false

    - name: Apply service and bootloader changes before final checks
      ansible.builtin.meta: flush_handlers

    - name: Verify core services and loaded dialplan
      ansible.builtin.import_tasks: tasks/health.yml
      vars:
        check_custom_dialplan: true
        required_freepbx_modules: [framework, core, certman]

  handlers:
    - name: update grub
      ansible.builtin.command: update-grub

    - name: restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted
