[from-pstn-sg]
; Assign this context only to trusted provider trunks, never anonymous SIP.
exten => _.,1,NoOp(Extracting inbound DID from the SIP To header)
 same => n,Set(SG_TO=)
 same => n,GotoIf($["${CHANNEL(channeltype)}"="SIP"]?sip)
 same => n,GotoIf($["${CHANNEL(channeltype)}"="PJSIP"]?pjsip)
 same => n,Goto(fallback)
 same => n(sip),Set(SG_TO=${SIP_HEADER(To)})
 same => n,Goto(parse)
 same => n(pjsip),Set(SG_TO=${PJSIP_HEADER(read,To)})
 same => n(parse),Gosub(sg-pstn-parse-to,s,1)
 same => n,Set(DID=${GOSUB_RETVAL})
 same => n,GotoIf($["${DID}"=""]?fallback)
 same => n,Gosub(sg-pstn-normalize,s,1(${DID}))
 same => n,Set(DID=${GOSUB_RETVAL})
 same => n,Set(SG_CALLER=${CALLERID(num)})
 same => n,Gosub(sg-pstn-normalize-caller,s,1)
 same => n,Set(CALLERID(num)=${GOSUB_RETVAL})
 same => n,Set(SG_CALLER=${CALLERID(name)})
 same => n,Gosub(sg-pstn-normalize-caller,s,1)
 same => n,Set(CALLERID(name)=${GOSUB_RETVAL})
 same => n,Goto(from-pstn,${DID},1)
; Missing/invalid headers and unsupported channels retain normal inbound routing.
 same => n(fallback),Goto(from-pstn,${EXTEN},1)

[sg-pstn-parse-to]
; Read SG_TO directly: passing a display name containing commas as a Gosub
; argument would split it. CUT takes variable names, not nested functions.
exten => s,1,Set(LOCAL(SG_URI)=${SG_TO})
 same => n,ExecIf(${REGEX("<" ${SG_TO})}?Set(LOCAL(SG_URI)=${CUT(SG_TO,<,2)}))
 same => n,Set(LOCAL(SG_URI)=${CUT(SG_URI,>,1)})
 same => n,GotoIf(${REGEX("^sips?:" ${SG_URI})}?extract:invalid)
 same => n(extract),GotoIf(${REGEX("@." ${SG_URI})}?user:invalid)
 same => n(user),Set(LOCAL(SG_USER)=${CUT(SG_URI,:,2)})
 same => n,Set(LOCAL(SG_USER)=${CUT(SG_USER,@,1)})
 same => n,Set(LOCAL(SG_USER)=${CUT(SG_USER,\;,1)})
 same => n,GotoIf(${REGEX("^[+]?[0-9]+$" ${SG_USER})}?valid:invalid)
 same => n(valid),Return(${SG_USER})
 same => n(invalid),Return()

[sg-pstn-normalize]
; Match the entire Singapore number. A local 65xxxxxx must remain unchanged.
exten => s,1,GotoIf(${REGEX("^[+]65[0-9]{8}$" ${ARG1})}?plus)
 same => n,GotoIf(${REGEX("^65[0-9]{8}$" ${ARG1})}?country)
 same => n,Return(${ARG1})
 same => n(plus),Return(${ARG1:3})
 same => n(country),Return(${ARG1:2})

[sg-pstn-normalize-caller]
; Preserve display names and the existing policy of stripping only +65 on CLI.
exten => s,1,GotoIf(${REGEX("^[+]65[0-9]{8}$" ${SG_CALLER})}?plus)
 same => n,Return(${SG_CALLER})
 same => n(plus),Return(${SG_CALLER:3})
