---
# OpenSSH generally takes the first global value. Prepend before Include/Match
# so an earlier cloud-image drop-in cannot silently disable password login.
- name: Enable root and password authentication with syntax validation
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertbefore: BOF
    marker: '# {mark} ANSIBLE MANAGED ROOT PASSWORD SSH'
    block: |
      PermitRootLogin yes
      PasswordAuthentication yes
    validate: /usr/sbin/sshd -t -f %s
  notify: reload ssh

- name: Check effective root SSH authentication settings
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -C
      - user=root,host=localhost,addr=127.0.0.1
  register: root_ssh_config
  changed_when: false

- name: Require root password authentication to be enabled
  ansible.builtin.assert:
    that:
      - "'permitrootlogin yes' in root_ssh_config.stdout_lines"
      - "'passwordauthentication yes' in root_ssh_config.stdout_lines"
      - "'authenticationmethods any' in root_ssh_config.stdout_lines or 'authenticationmethods password' in root_ssh_config.stdout_lines"
    fail_msg: A Match or AuthenticationMethods policy prevents root password-only SSH; inspect sshd -T and sshd_config.

- name: Enable and start Debian SSH service
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
