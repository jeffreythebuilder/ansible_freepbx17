[from-pstn-sg]
; Fall back to the originally called extension if no usable To-header DID exists.
exten => _.,1,Set(SG_DID=${EXTEN})
same => n,GotoIf($["${CHANNEL(channeltype)}"="PJSIP"]?pjsip)
same => n,GotoIf($["${CHANNEL(channeltype)}"="SIP"]?sip:normalize)

same => n(pjsip),Set(SG_TO=${PJSIP_HEADER(read,To)})
same => n,Goto(parse)
same => n(sip),Set(SG_TO=${SIP_HEADER(To)})

; Handle name-addr headers and bare SIP/SIPS URIs without nested CUT calls.
same => n(parse),Set(SG_URI=${CUT(SG_TO,<,2)})
same => n,ExecIf($[${LEN(${SG_URI})}=0]?Set(SG_URI=${SG_TO}))
same => n,Set(SG_URI=${CUT(SG_URI,>,1)})
same => n,GotoIf($[${LEN(${SG_URI})}=0]?normalize)
same => n,Set(SG_TO_USER=${PJSIP_PARSE_URI(${SG_URI},user)})
same => n,ExecIf($[${REGEX("^[+]?[0-9]+$" ${SG_TO_USER})}=1]?Set(SG_DID=${SG_TO_USER}))

; Strip a country prefix only from complete Singapore numbers.
same => n(normalize),ExecIf($[${REGEX("^[+]65[0-9]{8}$" ${SG_DID})}=1]?Set(SG_DID=${SG_DID:3}))
same => n,ExecIf($[${REGEX("^65[0-9]{8}$" ${SG_DID})}=1]?Set(SG_DID=${SG_DID:2}))
same => n,ExecIf($[${REGEX("^[+]65[0-9]{8}$" ${CALLERID(num)})}=1]?Set(CALLERID(num)=${CALLERID(num):3}))
same => n,ExecIf($[${REGEX("^65[0-9]{8}$" ${CALLERID(num)})}=1]?Set(CALLERID(num)=${CALLERID(num):2}))

; Normalize numeric caller-ID names too, but preserve actual names.
same => n,ExecIf($[${REGEX("^[+]65[0-9]{8}$" ${CALLERID(name)})}=1]?Set(CALLERID(name)=${CALLERID(name):3}))
same => n,ExecIf($[${REGEX("^65[0-9]{8}$" ${CALLERID(name)})}=1]?Set(CALLERID(name)=${CALLERID(name):2}))
same => n,Goto(from-pstn,${SG_DID},1)

exten => h,1,NoOp()
