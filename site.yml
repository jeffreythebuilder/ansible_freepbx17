---
- name: Install FreePBX 17 on Debian 12
  hosts: localhost
  connection: local
  become: true

  vars:
    # Pin this to a commit or branch in production. "main" tracks the latest
    # published Provisioner build and is convenient for a fresh installation.
    provisioner_repo: https://github.com/jeffreythebuilder/provisioner.git
    provisioner_version: main
    provisioner_source: /usr/local/src/provisioner
    provisioner_module_dir: /var/www/html/admin/modules/provisioner

  tasks:
    - name: Enable SSH root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#*PermitRootLogin'
        line: 'PermitRootLogin yes'
        state: present
      notify: restart sshd

    - name: Enable serial console service
      systemd:
        name: serial-getty@ttyS0.service
        enabled: yes
        state: started

    - name: Configure GRUB serial console - CMDLINE_DEFAULT
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200n8 console=tty0"'
        state: present
      notify: update grub

    - name: Configure GRUB serial console - TERMINAL
      lineinfile:
        path: /etc/default/grub
        regexp: '^#*GRUB_TERMINAL='
        line: 'GRUB_TERMINAL="console serial"'
        state: present
      notify: update grub

    - name: Configure GRUB serial console - SERIAL_COMMAND
      lineinfile:
        path: /etc/default/grub
        regexp: '^#*GRUB_SERIAL_COMMAND='
        line: 'GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"'
        state: present
      notify: update grub

    - name: Set serial port speed
      command: stty -F /dev/ttyS0 speed 115200

    - name: Install setserial
      apt:
        name: setserial
        state: present

    - name: Set baud rate with setserial
      command: setserial /dev/ttyS0 baud_base 115200

    - name: Install dnsmasq
      apt:
        name: dnsmasq
        state: present

    - name: Install chrony
      apt:
        name: chrony
        state: present
        update_cache: yes

    - name: Configure chrony to allow NTP clients
      lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^#?allow'
        line: allow
        create: yes
      notify: restart chrony

    - name: Download FreePBX install script
      get_url:
        url: https://github.com/FreePBX/sng_freepbx_debian_install/raw/master/sng_freepbx_debian_install.sh
        dest: /tmp/sng_freepbx_debian_install.sh
        mode: '0755'

    - name: Run FreePBX install script
      command: bash /tmp/sng_freepbx_debian_install.sh
      args:
        creates: /etc/freepbx.conf

    - name: Check out Provisioner source
      ansible.builtin.git:
        repo: "{{ provisioner_repo }}"
        dest: "{{ provisioner_source }}"
        version: "{{ provisioner_version }}"
        force: true
        update: true

    - name: Install Provisioner module files
      ansible.builtin.copy:
        src: "{{ provisioner_source }}/"
        dest: "{{ provisioner_module_dir }}/"
        remote_src: true
        owner: asterisk
        group: asterisk
        mode: preserve

    - name: Install or upgrade Provisioner in FreePBX
      ansible.builtin.command: fwconsole ma install provisioner --force
      register: provisioner_install
      changed_when: >-
        provisioner_install.rc == 0 and
        ('successfully installed' in (provisioner_install.stdout | lower) or
         'successfully updated' in (provisioner_install.stdout | lower) or
         'successfully upgraded' in (provisioner_install.stdout | lower))
        
    - name: Add custom PSTN dialplan (from-pstn-sg)
      blockinfile:
        path: /etc/asterisk/extensions_custom.conf
        create: yes
        owner: asterisk
        group: asterisk
        mode: '0644'
        marker: "; {mark} ANSIBLE MANAGED BLOCK - from-pstn-sg"
        block: |
          [from-pstn-sg]
          exten => _.,1,NoOp(Attempting to extract DID from SIP To header)
          exten => _.,n,GotoIf($["${CHANNEL(channeltype)}"="SIP"]?SIP)
          exten => _.,n,GotoIf($["${CHANNEL(channeltype)}"="PJSIP"]?PJSIP)
          exten => _.,n,NoOp(Unable to determine SIP channel type)
          exten => _.,n,Goto(from-pstn,${EXTEN},1)
          exten => _.,n(SIP),Set(DID=${CUT(CUT(SIP_HEADER(To),@,1),:,2)})
          exten => _.,n(PJSIP),Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
          exten => _.,n,NoOp(Processing Caller ID and DID)
          exten => _.,n,ExecIf($["${CALLERID(name):0:3}" = "+65"]?Set(CALLERID(name)=${CALLERID(name):3}))
          exten => _.,n,ExecIf($["${CALLERID(num):0:3}" = "+65"]?Set(CALLERID(num)=${CALLERID(num):3}))
          exten => _.,n,ExecIf($["${DID:0:3}" = "+65"]?Set(DID=${DID:3}))  ; Strip "+65"
          exten => _.,n,ExecIf($["${DID:0:2}" = "65"]?Set(DID=${DID:2}))  ; Remove "65" prefix from DID
           exten => _.,n,Goto(from-pstn,${DID},1)

    - name: Add trunk 4 forwarded-call caller ID dialplan
      ansible.builtin.blockinfile:
        path: /etc/asterisk/extensions_custom.conf
        create: true
        owner: asterisk
        group: asterisk
        mode: '0644'
        marker: "; {mark} ANSIBLE MANAGED BLOCK - macro-dialout-trunk-predial-hook"
        block: |
          [macro-dialout-trunk-predial-hook]
          exten => s,1,GotoIf($["${DIAL_TRUNK}"!="4"]?done)
          same => n,GotoIf($["${BLINDTRANSFER}"=""]?forward)
          same => n,Set(XFER_CID_DEVICE=${CUT(BLINDTRANSFER,/,2)})
          same => n,Set(XFER_CID_DEVICE=${CUT(XFER_CID_DEVICE,-,1)})
          same => n,Set(XFER_CID_USER=${DB(DEVICE/${XFER_CID_DEVICE}/user)})
          same => n,ExecIf($["${XFER_CID_USER}"=""]?Set(XFER_CID_USER=${XFER_CID_DEVICE}))
          same => n,Goto(cid)
          same => n(forward),GotoIf($["${DIVERSION_REASON}"!="unconditional" | "${CHANNEL(channeltype)}"!="Local" | "${EXTTOCALL}"=""]?done)
          same => n,GotoIf($["${DB(CF/${EXTTOCALL})}"!="${DIAL_NUMBER}"]?done)
          same => n,Set(XFER_CID_USER=${EXTTOCALL})
          same => n(cid),Set(XFER_CID_NUMBER=${DB(AMPUSER/${XFER_CID_USER}/outboundcid)})
          same => n,GotoIf($[${REGEX("^([0-9]{8}|65[0-9]{8}|[+]65[0-9]{8})$" ${XFER_CID_NUMBER})}=0]?invalid)
          same => n,Set(XFER_CID_NUMBER=${FILTER(0-9,${XFER_CID_NUMBER})})
          same => n,ExecIf($[${LEN(${XFER_CID_NUMBER})}=8]?Set(XFER_CID_NUMBER=65${XFER_CID_NUMBER}))
          same => n,GotoIf($["${BLINDTRANSFER}"=""]?identity)
          same => n,Set(XFER_ENDPOINT=${OUT_${DIAL_TRUNK}_SUFFIX:1})
          same => n,Set(XFER_AOR=${PJSIP_ENDPOINT(${XFER_ENDPOINT},aors)})
          same => n,Set(XFER_CONTACT=${PJSIP_AOR(${XFER_AOR},contact)})
          same => n,GotoIf($[${REGEX("," ${XFER_AOR}${XFER_CONTACT})}=1 | "${XFER_CONTACT}"=""]?invalid)
          same => n,Set(XFER_URI=${PJSIP_CONTACT(${XFER_CONTACT},uri)})
          same => n,GotoIf($[${REGEX("^sip:[A-Za-z0-9_.-]+@[0-9.]+(:[0-9]+)?$" ${XFER_URI})}=0]?invalid)
          same => n,Gosub(func-set-sipheader,s,1(Referred-By,<${CUT(XFER_URI,:,1-2)}>))
          same => n(identity),Set(CALLERID(num)=${XFER_CID_NUMBER})
          same => n,Set(CALLERID(name)=${XFER_CID_NUMBER})
          same => n,Set(CDR(outbound_cnum)=${XFER_CID_NUMBER})
          same => n,Set(CDR(outbound_cnam)=${XFER_CID_NUMBER})
          same => n,ExecIf($[${REGEX("^[0-9]{8}$" ${OUTNUM})}=1]?Set(OUTNUM=+65${OUTNUM}))
          same => n,Set(PREDIAL_HOOK_RET=)
          same => n,Goto(done)
          same => n(invalid),Set(PREDIAL_HOOK_RET=BYPASS)
          same => n(done),MacroExit()

    - name: Download and install certman module
      command: fwconsole ma downloadinstall certman --force
      ignore_errors: yes

    - name: Reload FreePBX and fix permissions
      shell: fwconsole reload && fwconsole chown
      ignore_errors: yes

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted

    - name: update grub
      command: update-grub

    - name: restart chrony
      service:
        name: chrony
        state: restarted
