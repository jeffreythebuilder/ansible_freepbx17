---
- name: Install FreePBX 17 on Debian 12
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Enable SSH root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#*PermitRootLogin'
        line: 'PermitRootLogin yes'
        state: present
      notify: restart sshd

    - name: Enable serial console service
      systemd:
        name: serial-getty@ttyS0.service
        enabled: yes
        state: started

    - name: Configure GRUB serial console - CMDLINE_DEFAULT
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200n8 console=tty0"'
        state: present
      notify: update grub

    - name: Configure GRUB serial console - TERMINAL
      lineinfile:
        path: /etc/default/grub
        regexp: '^#*GRUB_TERMINAL='
        line: 'GRUB_TERMINAL="console serial"'
        state: present
      notify: update grub

    - name: Configure GRUB serial console - SERIAL_COMMAND
      lineinfile:
        path: /etc/default/grub
        regexp: '^#*GRUB_SERIAL_COMMAND='
        line: 'GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"'
        state: present
      notify: update grub

    - name: Set serial port speed
      command: stty -F /dev/ttyS0 speed 115200

    - name: Install setserial
      apt:
        name: setserial
        state: present

    - name: Set baud rate with setserial
      command: setserial /dev/ttyS0 baud_base 115200

    - name: Install dnsmasq
      apt:
        name: dnsmasq
        state: present

    - name: Install chrony
      apt:
        name: chrony
        state: present
        update_cache: yes

    - name: Configure chrony to allow NTP clients
      lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^#?allow'
        line: allow
        create: yes
      notify: restart chrony

    - name: Download FreePBX install script
      get_url:
        url: https://github.com/FreePBX/sng_freepbx_debian_install/raw/master/sng_freepbx_debian_install.sh
        dest: /tmp/sng_freepbx_debian_install.sh
        mode: '0755'

    - name: Run FreePBX install script
      command: bash /tmp/sng_freepbx_debian_install.sh
      args:
        creates: /etc/freepbx.conf
        
    - name: Add custom PSTN dialplan (from-pstn-sg)
      blockinfile:
        path: /etc/asterisk/extensions_custom.conf
        create: yes
        owner: asterisk
        group: asterisk
        mode: '0644'
        marker: "; {mark} ANSIBLE MANAGED BLOCK - from-pstn-sg"
        block: |
          [from-pstn-sg]
          exten => _.,1,NoOp(Attempting to extract DID from SIP To header)
          exten => _.,n,GotoIf($["${CHANNEL(channeltype)}"="SIP"]?SIP)
          exten => _.,n,GotoIf($["${CHANNEL(channeltype)}"="PJSIP"]?PJSIP)
          exten => _.,n,NoOp(Unable to determine SIP channel type)
          exten => _.,n,Goto(from-pstn,${EXTEN},1)
          exten => _.,n(SIP),Set(DID=${CUT(CUT(SIP_HEADER(To),@,1),:,2)})
          exten => _.,n(PJSIP),Set(DID=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
          exten => _.,n,NoOp(Processing Caller ID and DID)
          exten => _.,n,ExecIf($["${CALLERID(name):0:3}" = "+65"]?Set(CALLERID(name)=${CALLERID(name):3}))
          exten => _.,n,ExecIf($["${CALLERID(num):0:3}" = "+65"]?Set(CALLERID(num)=${CALLERID(num):3}))
          exten => _.,n,ExecIf($["${DID:0:3}" = "+65"]?Set(DID=${DID:3}))  ; Strip "+65"
          exten => _.,n,ExecIf($["${DID:0:2}" = "65"]?Set(DID=${DID:2}))  ; Remove "65" prefix from DID
          exten => _.,n,Goto(from-pstn,${DID},1)

    - name: Download and install certman module
      command: fwconsole ma downloadinstall certman --force
      ignore_errors: yes

    - name: Reload FreePBX and fix permissions
      shell: fwconsole reload && fwconsole chown
      ignore_errors: yes

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted

    - name: update grub
      command: update-grub

    - name: restart chrony
      service:
        name: chrony
        state: restarted
