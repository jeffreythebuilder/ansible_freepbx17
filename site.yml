---
- name: Install FreePBX 17 on Debian 12
  hosts: localhost
  connection: local
  become: true
  environment:
    LC_ALL: C
    DEBIAN_FRONTEND: noninteractive

  vars_files:
    - defaults.yml

  pre_tasks:
    - name: Require active monitoring before making installation changes
      ansible.builtin.assert:
        that:
          - ansible_check_mode or lookup('ansible.builtin.env', 'FREEPBX_MONITOR_ACTIVE') == '1'
        fail_msg: Monitoring callback is unavailable; run from the reviewed checkout with its ansible.cfg.

    - name: Install default installation monitoring
      ansible.builtin.import_tasks: tasks/monitor.yml

    - name: Check supported platform
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '12'
          - ansible_architecture == 'x86_64'
          - ansible_service_mgr == 'systemd'
          - ansible_virtualization_type not in ['docker', 'lxc', 'podman', 'container']
        fail_msg: Use a fresh Debian 12 amd64 machine or full VM with systemd, not a container.

    - name: Wait for an address and default route before network-dependent setup
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/monitor/wait_for_network.py"
          - --timeout
          - '120'
      changed_when: false

    - name: Check hostname resolution required by the upstream installer
      ansible.builtin.command: hostname -f
      changed_when: false

    - name: Check mandatory serial-console prerequisites before installing FreePBX
      ansible.builtin.import_tasks: tasks/serial-preflight.yml

  tasks:
    - name: Create private installation state directory
      ansible.builtin.file:
        path: /var/lib/freepbx-install
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Enable root password SSH access
      ansible.builtin.import_tasks: tasks/ssh.yml

    - name: Configure mandatory serial console
      ansible.builtin.import_tasks: tasks/serial.yml

    - name: Apply management console changes before starting FreePBX
      ansible.builtin.meta: flush_handlers

    - name: Install and validate FreePBX
      ansible.builtin.import_tasks: tasks/install.yml

    - name: Install dnsmasq
      ansible.builtin.apt:
        name: dnsmasq
        state: present

    - name: Preserve unrestricted NTP serving as intended for this appliance
      ansible.builtin.blockinfile:
        path: /etc/chrony/chrony.conf
        insertafter: EOF
        marker: '# {mark} ANSIBLE MANAGED NTP CLIENT ACCESS'
        block: |
          port 123
          allow
      notify: restart chrony

    - name: Add custom PSTN dialplan (from-pstn-sg)
      ansible.builtin.blockinfile:
        path: /etc/asterisk/extensions_custom.conf
        create: true
        owner: asterisk
        group: asterisk
        mode: '0644'
        marker: '; {mark} ANSIBLE MANAGED BLOCK - from-pstn-sg'
        block: "{{ lookup('ansible.builtin.file', 'files/from-pstn-sg.conf') }}"

    - name: Download and force-install certman as in the original deployment
      ansible.builtin.command: fwconsole ma downloadinstall certman --force --autoenable --no-interaction

    - name: Fix FreePBX permissions
      ansible.builtin.command: fwconsole chown
      changed_when: false

    - name: Reload FreePBX and fail on configuration errors
      ansible.builtin.command: fwconsole reload
      changed_when: false

    - name: Apply service and bootloader changes before final checks
      ansible.builtin.meta: flush_handlers

    - name: Verify core services and loaded dialplan
      ansible.builtin.import_tasks: tasks/health.yml
      vars:
        check_custom_dialplan: true
        required_freepbx_modules: [framework, core, certman]

  handlers:
    - name: update grub
      ansible.builtin.command: update-grub

    - name: restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted
